name: Refresh the Arcane Observatory

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-observatory.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query profile observatories and render SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Shade555
        run: python scripts/update_stats.py
      - name: Commit updated instruments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh archive observatory"
            git push
          fi
